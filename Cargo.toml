[package]
name = "faceit-demo-extractor"
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
default-run = "faceit-dem"

[lib]
name = "faceit_demo_extractor"
path = "src/lib.rs"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

[dependencies]
bzip2 = "0.6.1"
colored = "3.1.1"
ctrlc = "3.5.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
unicode-general-category = "1.1.0"
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"
zstd = "0.14.3"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
